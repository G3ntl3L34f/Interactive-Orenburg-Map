<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Оренбургская область — PRO карта</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
}

#map {
    width: 100%;
    height: 100vh;
}

/* SIDEBAR */
#sidebar {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 320px;
    max-height: 90vh;
    overflow: auto;
    background: white;
    padding: 10px;
    border-radius: 8px;
    z-index: 1000;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.group {
    margin-top: 10px;
    padding-top: 5px;
    border-top: 1px solid #ddd;
}

.group-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.item {
    display: flex;
    gap: 8px;
    padding: 6px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
}

.item:hover {
    background: #f0f0f0;
}

.item img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 6px;
}

.text {
    flex: 1;
}

.title {
    font-weight: bold;
    font-size: 13px;
}

.desc {
    font-size: 11px;
    color: #555;
}

/* popup */
.popup {
    position: absolute;
    background: white;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    display: none;
    z-index: 2000;
    min-width: 200px;
}

/* LEGEND */
#legend {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: white;
    padding: 15px;
    border-radius: 8px;
    z-index: 1000;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 12px;
}

.legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid white;
}
</style>
</head>

<body>

<div id="sidebar">
    <b>📍 Объекты</b>
    <div id="list"></div>
</div>

<div id="map"></div>
<div id="popup" class="popup"></div>

<div id="legend">
    <b style="display:block; margin-bottom:8px;">📍 Легенда</b>
    <div class="legend-item">
        <div class="legend-dot" style="background:#22c55e;"></div>
        <span>Природа</span>
    </div>
    <div class="legend-item">
        <div class="legend-dot" style="background:#8b5cf6;"></div>
        <span>История</span>
    </div>
    <div class="legend-item">
        <div class="legend-dot" style="background:#f59e0b;"></div>
        <span>Культура</span>
    </div>
</div>

<script>

// ===================== MAP =====================
const view = new ol.View({
    center: ol.proj.fromLonLat([55.1, 51.77]),
    zoom: 6,
    minZoom: 6,
    maxZoom: 14,
    constrainOnlyCenter: true
});

const map = new ol.Map({
    target: 'map',
    layers: [
        new ol.layer.Tile({
            source: new ol.source.OSM()
        })
    ],
    view: view
});

// ===================== DATA =====================
const vectorSource = new ol.source.Vector();

map.addLayer(new ol.layer.Vector({
    source: vectorSource
}));

// ===================== ICON =====================
function getIcon(type) {
    let iconFile = "marker-default.png";

    if (type) {
        const typeKey = type.toLowerCase();
        if (typeKey === "природа") iconFile = "marker-nature.png";
        else if (typeKey === "история") iconFile = "marker-history.png";
        else if (typeKey === "культура") iconFile = "marker-culture.png";
    }

    return new ol.style.Style({
        image: new ol.style.Icon({
            src: "/" + iconFile,
            scale: 0.05,
            anchor: [0.5, 1]
        })
    });
}

// ===================== LOAD =====================
function loadPlaces() {

    vectorSource.clear();
    const list = document.getElementById("list");
    list.innerHTML = "<p style='color:#999'>Загрузка...</p>";

    fetch("http://localhost:8000/api/places")
    .then(r => {
        if (!r.ok) throw new Error(`Ошибка API: ${r.status}`);
        return r.json();
    })
    .then(data => {
        if (!data || data.length === 0) {
            list.innerHTML = "<p style='color:#f00'>Нет данных. Запустите: python seed_data.py</p>";
            return;
        }

        const groups = {
            "природа": [],
            "история": [],
            "культура": [],
            "другое": []
        };

        data.forEach(p => {
            const t = (p.type || "").toLowerCase();
            if (groups[t]) groups[t].push(p);
            else groups["другое"].push(p);
        });

        list.innerHTML = "";

        for (const [type, items] of Object.entries(groups)) {

            if (!items.length) continue;

            const groupDiv = document.createElement("div");
            groupDiv.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.innerText = type.toUpperCase();

            groupDiv.appendChild(title);

            items.forEach(place => {

                // MARKER С ИКОНКОЙ
                const feature = new ol.Feature({
                    geometry: new ol.geom.Point(
                        ol.proj.fromLonLat([place.longitude, place.latitude])
                    ),
                    data: place
                });

                feature.setStyle(getIcon(place.type));

                vectorSource.addFeature(feature);

                // SIDEBAR ITEM
                const item = document.createElement("div");
                item.className = "item";

                item.innerHTML = `
                    <img src="${place.photo || 'https://via.placeholder.com/50'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2250%22%3E%3Crect fill=%22%23ddd%22 width=%2250%22 height=%2250%22/%3E%3C/svg%3E'">
                    <div class="text">
                        <div class="title">${place.name}</div>
                        <div class="desc">${place.description || ''}</div>
                    </div>
                `;

                item.onclick = () => {
                    map.getView().animate({
                        center: ol.proj.fromLonLat([place.longitude, place.latitude]),
                        zoom: 9,
                        duration: 800
                    });
                };

                groupDiv.appendChild(item);
            });

            list.appendChild(groupDiv);
        }

        console.log("✅ Данные загружены:", data.length, "объектов");
    })
    .catch(err => {
        console.error("❌ Ошибка загрузки:", err);
        list.innerHTML = `<p style='color:#f00'>❌ Ошибка: ${err.message}<br>Проверьте, запущен ли сервер на http://localhost:8000</p>`;
    });
}

// ===================== POPUP =====================
const popup = document.getElementById("popup");

map.on("click", function(evt) {

    popup.style.display = "none";

    map.forEachFeatureAtPixel(evt.pixel, function(feature) {

        const d = feature.get("data");
        if (!d) return;

        const coord = feature.getGeometry().getCoordinates();
        const pixel = map.getPixelFromCoordinate(coord);

        popup.style.left = pixel[0] + "px";
        popup.style.top = (pixel[1] - 80) + "px";
        popup.style.display = "block";

        popup.innerHTML = `
            <div style="width:220px">

                <img src="${d.photo || 'https://via.placeholder.com/220x120'}"
                     style="width:100%; height:120px; object-fit:cover; border-radius:8px; margin-bottom:8px;"
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22220%22 height=%22120%22%3E%3Crect fill=%22%23ddd%22 width=%22220%22 height=%22120%22/%3E%3C/svg%3E'">

                <b>${d.name}</b><br>
                <i>${d.type}</i><br><br>

                <div style="font-size:12px; color:#444;">
                    ${d.description}
                </div>

            </div>
        `;
    });
});

// ===================== REGION + BLACK MASK =====================
fetch("orenburg.geojson")
.then(r => {
    if (!r.ok) throw new Error(`GeoJSON не найден: ${r.status}`);
    return r.json();
})
.then(data => {

    const format = new ol.format.GeoJSON();

    const features = format.readFeatures(data, {
        featureProjection: "EPSG:3857"
    });

    const maskFeatures = [];

    // Границы мира в EPSG:3857
    const worldExtent = ol.proj.get("EPSG:3857").getExtent();

    features.forEach(feature => {

        const geom = feature.getGeometry();

        if (geom instanceof ol.geom.Polygon) {

            const mask = new ol.geom.Polygon([
                [
                    [worldExtent[0], worldExtent[1]],
                    [worldExtent[2], worldExtent[1]],
                    [worldExtent[2], worldExtent[3]],
                    [worldExtent[0], worldExtent[3]],
                    [worldExtent[0], worldExtent[1]]
                ],
                ...geom.getCoordinates()
            ]);

            maskFeatures.push(
                new ol.Feature(mask)
            );
        }

        if (geom instanceof ol.geom.MultiPolygon) {

            geom.getPolygons().forEach(poly => {

                const mask = new ol.geom.Polygon([
                    [
                        [worldExtent[0], worldExtent[1]],
                        [worldExtent[2], worldExtent[1]],
                        [worldExtent[2], worldExtent[3]],
                        [worldExtent[0], worldExtent[3]],
                        [worldExtent[0], worldExtent[1]]
                    ],
                    ...poly.getCoordinates()
                ]);

                maskFeatures.push(
                    new ol.Feature(mask)
                );
            });
        }
    });

    // Чёрная маска
    const maskLayer = new ol.layer.Vector({
        source: new ol.source.Vector({
            features: maskFeatures
        }),
        style: new ol.style.Style({
            fill: new ol.style.Fill({
                color: "rgba(0,0,0,0.85)"
            }),
            stroke: null
        })
    });

    map.addLayer(maskLayer);

    // Контур области поверх маски
    const regionLayer = new ol.layer.Vector({
        source: new ol.source.Vector({
            features
        }),
        style: new ol.style.Style({
            stroke: new ol.style.Stroke({
                color: "#ff0000",
                width: 3
            }),
            fill: new ol.style.Fill({
                color: "rgba(0,0,0,0)"
            })
        })
    });

    map.addLayer(regionLayer);

const regionExtent = regionLayer.getSource().getExtent();

const width = regionExtent[2] - regionExtent[0];
const height = regionExtent[3] - regionExtent[1];

const restrictedExtent = [
    regionExtent[0],
    regionExtent[1],
    regionExtent[2],
    regionExtent[3]
];

const currentZoom = view.getZoom();

map.setView(new ol.View({
    center: ol.extent.getCenter(regionExtent),
    zoom: currentZoom,
    minZoom: 6,
    maxZoom: 14,
    extent: restrictedExtent,
    constrainOnlyCenter: true,
    smoothExtentConstraint: false
}));

map.getView().fit(regionExtent, {
    padding: [40, 40, 40, 40],
    duration: 500,
    maxZoom: 8
});

    console.log("✅ GeoJSON загружена");
})
.catch(err => console.warn("⚠️ Границы не загружены:", err.message));


// START
loadPlaces();

</script>

</body>
</html>
