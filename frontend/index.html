<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Оренбургская область — PRO карта</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
}

#map {
    width: 100%;
    height: 100vh;
}

/* SIDEBAR */
#sidebar {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 280px;
    max-height: 90vh;
    overflow: auto;
    background: white;
    padding: 10px;
    border-radius: 8px;
    z-index: 1000;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.group {
    margin-top: 10px;
    padding-top: 5px;
    border-top: 1px solid #ddd;
}

.group-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.item {
    padding: 5px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
}

.item:hover {
    background: #f0f0f0;
}

/* popup */
.popup {
    position: absolute;
    background: white;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    display: none;
    z-index: 2000;
}
</style>
</head>

<body>

<div id="sidebar">
    <b>📍 Объекты</b>
    <div id="list"></div>
</div>

<div id="map"></div>
<div id="popup" class="popup"></div>

<script>

// =====================
// MAP
// =====================
const map = new ol.Map({
    target: 'map',
    layers: [
        new ol.layer.Tile({
            source: new ol.source.OSM()
        })
    ],
    view: new ol.View({
        center: ol.proj.fromLonLat([55.1, 51.77]),
        zoom: 6
    })
});

// =====================
// DATA
// =====================
const vectorSource = new ol.source.Vector();

const vectorLayer = new ol.layer.Vector({
    source: vectorSource
});

map.addLayer(vectorLayer);

// =====================
// COLOR
// =====================
function getColor(type) {
    if (!type) return "gray";

    type = type.toLowerCase();

    if (type === "природа") return "green";
    if (type === "история") return "red";
    if (type === "культура") return "blue";

    return "gray";
}

// =====================
// LOAD
// =====================
function loadPlaces() {

    vectorSource.clear();
    const list = document.getElementById("list");
    list.innerHTML = "";

    fetch("http://localhost:8000/places")
    .then(r => r.json())
    .then(data => {

        // 🔥 1. группировка по типам
        const groups = {
            "природа": [],
            "история": [],
            "культура": [],
            "другое": []
        };

        data.forEach(p => {
            const t = (p.type || "").toLowerCase();

            if (groups[t]) groups[t].push(p);
            else groups["другое"].push(p);
        });

        // 🔥 2. рендер групп
        for (const [type, items] of Object.entries(groups)) {

            if (items.length === 0) continue;

            const groupDiv = document.createElement("div");
            groupDiv.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.innerText = type.toUpperCase();

            groupDiv.appendChild(title);

            items.forEach(place => {

                // marker
                const feature = new ol.Feature({
                    geometry: new ol.geom.Point(
                        ol.proj.fromLonLat([place.longitude, place.latitude])
                    ),
                    data: place
                });

                feature.setStyle(new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 7,
                        fill: new ol.style.Fill({
                            color: getColor(place.type)
                        }),
                        stroke: new ol.style.Stroke({
                            color: "#fff",
                            width: 2
                        })
                    })
                }));

                vectorSource.addFeature(feature);

                // sidebar item
                const item = document.createElement("div");
                item.className = "item";
                item.innerText = "📍 " + place.name;

                item.onclick = () => {
                    map.getView().animate({
                        center: ol.proj.fromLonLat([place.longitude, place.latitude]),
                        zoom: 9,
                        duration: 800
                    });
                };

                groupDiv.appendChild(item);
            });

            list.appendChild(groupDiv);
        }

    });
}

// =====================
// POPUP
// =====================
const popup = document.getElementById("popup");

map.on("click", function(evt) {

    popup.style.display = "none";

    map.forEachFeatureAtPixel(evt.pixel, function(feature) {

        const data = feature.get("data");
        if (!data) return;

        const coord = feature.getGeometry().getCoordinates();
        const pixel = map.getPixelFromCoordinate(coord);

        popup.style.left = pixel[0] + "px";
        popup.style.top = (pixel[1] - 60) + "px";
        popup.style.display = "block";

        popup.innerHTML = `
            <b>${data.name}</b><br>
            ${data.type}<br>
            ${data.description}
        `;
    });
});

// =====================
// REGION
// =====================
fetch("orenburg.geojson")
.then(r => r.json())
.then(data => {

    const format = new ol.format.GeoJSON();

    const features = format.readFeatures(data, {
        featureProjection: "EPSG:3857"
    });

    const region = new ol.layer.Vector({
        source: new ol.source.Vector({ features }),
        style: new ol.style.Style({
            stroke: new ol.style.Stroke({
                color: "yellow",
                width: 2
            }),
            fill: new ol.style.Fill({
                color: "rgba(0,0,0,0.0)"
            })
        })
    });

    map.addLayer(region);

    map.getView().fit(region.getSource().getExtent(), {
        padding: [40,40,40,40]
    });

});

// START
loadPlaces();

</script>

</body>
</html>
